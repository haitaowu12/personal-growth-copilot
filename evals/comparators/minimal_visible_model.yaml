schema_version: "1.0"
system_id: minimal_visible_model
status: governed-executable
comparison_role: minimal_visible_model_comparator
same_model_required: true
same_safety_policy_required: true
same_context_access_required: true
context_policy: READ_ONLY_USER_APPROVED
memory_policy: DISABLED
method_exclusions:
  - No extended coaching loop.
  - No Personal Growth Copilot technique references.
  - No hidden or automatic memory writes.
instructions:
  - Present confirmed facts, tentative hypotheses, alternatives, unknowns, and one user-owned action or intentional non-action.
  - Use the same approved context and safety policy as the target.
  - Stop after the smallest model needed for the decision unless the user asks to continue.
claim_limit: Execution supports paired comparison only. It does not establish product efficacy or superiority without governed human evidence.
