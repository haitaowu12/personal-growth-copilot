<title>Write requirements you can verify · Learning Lab</title><style>:root {
  color-scheme: light;
  --paper: #f7f6f1;
  --white: #fffefa;
  --ink: #202c2b;
  --muted: #586663;
  --line: #d9dfd8;
  --accent: #176154;
  --wash: #e6eee8;
  --warn: #874b22;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--ink);
  background: var(--paper);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-size: 16px;
  line-height: 1.6;
}
button,
input,
textarea {
  font: inherit;
}
button,
.file-button {
  cursor: pointer;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--white);
  color: var(--ink);
  padding: 10px 16px;
  min-height: 44px;
  font-size: 14px;
  line-height: 1.5;
  transition:
    background 0.12s,
    border-color 0.12s;
}
button:hover,
.file-button:hover {
  background: var(--wash);
  border-color: #91a89e;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}
button.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  font-weight: 650;
}
button.primary:hover {
  background: #124d43;
}
button.quiet {
  border-color: transparent;
  background: transparent;
  padding-left: 0;
  text-decoration: underline;
  text-underline-offset: 4px;
}
a {
  color: var(--accent);
  text-underline-offset: 3px;
}
a:focus-visible,
button:focus-visible,
input:focus-visible,
textarea:focus-visible,
.hint:focus,
.file-button:focus-within {
  outline: 3px solid #9c610a;
  outline-offset: 3px;
}
.skip {
  position: absolute;
  top: -80px;
  background: white;
  padding: 12px;
  z-index: 10;
}
.skip:focus {
  top: 0;
}
header {
  height: 84px;
  margin: 0 4vw;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  gap: 16px;
}
.wordmark {
  font-weight: 750;
  color: var(--ink);
  text-decoration: none;
  letter-spacing: -0.5px;
}
.wordmark span {
  font-weight: 400;
  color: var(--muted);
}
.edition,
.eyebrow {
  font-size: 11px;
  letter-spacing: 1.6px;
  font-weight: 700;
  color: var(--muted);
}
.layout {
  display: grid;
  grid-template-columns: 210px minmax(0, 680px) minmax(200px, 270px);
  max-width: 1320px;
  margin: 0 auto;
  min-height: calc(100vh - 225px);
  padding: 46px 4vw;
  gap: 40px;
}
nav {
  border-right: 1px solid var(--line);
  padding-right: 20px;
}
nav button {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  margin: 4px 0;
  padding: 11px 12px;
}
nav button.active {
  background: var(--wash);
  color: var(--accent);
  font-weight: 700;
}
nav small {
  display: block;
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
}
main {
  min-width: 0;
}
main:focus {
  outline: none;
}
h1,
h2 {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
  line-height: 1.12;
  letter-spacing: -1px;
}
h1 {
  font-size: clamp(34px, 4vw, 52px);
  margin: 14px 0 22px;
  max-width: 620px;
}
h2 {
  font-size: 34px;
  margin: 14px 0 20px;
}
h3 {
  font-size: 17px;
  line-height: 1.4;
  margin: 26px 0 10px;
}
p {
  margin: 0 0 18px;
}
.intro {
  font-size: 19px;
  color: var(--muted);
  line-height: 1.65;
}
.meta {
  font-size: 13px;
  color: var(--muted);
}
.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 24px;
}
.rule {
  height: 1px;
  background: var(--line);
  margin: 28px 0;
}
.path {
  padding-left: 22px;
}
.path li {
  padding: 7px 0;
}
fieldset {
  border: 0;
  padding: 0;
  margin: 24px 0;
}
legend {
  font-size: 21px;
  font-weight: 600;
  line-height: 1.5;
  margin-bottom: 22px;
  width: 100%;
}
.choice {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 5px;
  margin: 10px 0;
  cursor: pointer;
  line-height: 1.5;
  transition:
    background 0.12s,
    border-color 0.12s;
}
.choice:has(input:enabled):hover {
  background: var(--wash);
  border-color: #91a89e;
}
.choice:has(input:disabled) {
  cursor: not-allowed;
}
.choice:has(input:checked) {
  border-color: var(--accent);
  background: var(--wash);
}
.choice input {
  margin-top: 6px;
  accent-color: var(--accent);
  flex-shrink: 0;
}
.feedback {
  border-left: 3px solid var(--accent);
  padding: 16px 20px;
  background: var(--wash);
  margin: 22px 0;
  animation: appear 0.18s ease-out;
}
.feedback h3 {
  margin: 0 0 8px;
}
.feedback p:last-child {
  margin-bottom: 0;
}
.feedback.wrong {
  border-color: var(--warn);
  background: #f5ebdd;
}
.hint {
  color: var(--accent);
  font-size: 15px;
}
.example {
  border-left: 2px solid var(--line);
  padding: 4px 0 4px 20px;
  margin: 20px 0;
}
.example .label {
  display: block;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 1.2px;
  color: var(--muted);
  margin-bottom: 7px;
}
textarea {
  display: block;
  width: 100%;
  min-height: 190px;
  border: 1px solid #92a69c;
  background: var(--white);
  border-radius: 5px;
  padding: 16px;
  line-height: 1.6;
  resize: vertical;
  color: var(--ink);
}
.char-count {
  margin-top: -12px;
  text-align: right;
}
.check {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin: 14px 0;
  cursor: pointer;
}
.check input {
  margin-top: 7px;
  accent-color: var(--accent);
}
aside {
  font-size: 13px;
  color: var(--muted);
}
aside h3 {
  margin-top: 0;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink);
}
.source {
  padding: 0 0 16px;
  margin: 0 0 18px;
  border-bottom: 1px solid var(--line);
}
.source p {
  margin: 8px 0;
}
.metric {
  font-family: Georgia, serif;
  font-size: 34px;
  color: var(--ink);
  line-height: 1.2;
}
.progress-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 10px 0;
  font-size: 13px;
}
.progress-row span:last-child {
  color: var(--muted);
}
footer {
  border-top: 1px solid var(--line);
  padding: 20px 4vw;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--muted);
}
footer p {
  width: 100%;
  margin: 0;
  min-height: 20px;
}
.file-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  flex-wrap: wrap;
}
#import {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  overflow: hidden;
}
#storage label {
  display: flex;
  gap: 8px;
  align-items: center;
  cursor: pointer;
}
#storage input {
  accent-color: var(--accent);
}
.error {
  color: #963629;
  font-weight: 600;
}
.tag {
  font-size: 12px;
  color: var(--accent);
  font-weight: 650;
}
.empty {
  padding: 16px 0;
  color: var(--muted);
}
.report {
  margin-top: 28px;
}
.notice-box {
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 18px;
  margin-top: 28px;
}
@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media (max-width: 1100px) {
  .layout {
    grid-template-columns: 180px minmax(0, 1fr);
    gap: 28px;
  }
  aside {
    grid-column: 2;
    border-top: 1px solid var(--line);
    padding-top: 24px;
  }
}
@media (max-width: 700px) {
  header {
    height: 72px;
  }
  .wordmark span {
    display: block;
    font-size: 12px;
    letter-spacing: 0;
  }
  .edition {
    font-size: 10px;
  }
  .layout {
    display: block;
    padding: 22px 5vw;
  }
  nav {
    border-right: 0;
    border-bottom: 1px solid var(--line);
    padding: 0 0 14px;
    margin-bottom: 28px;
    display: flex;
    overflow-x: auto;
    gap: 4px;
  }
  nav button {
    width: auto;
    min-width: 120px;
    font-size: 12px;
    flex-shrink: 0;
    margin: 0;
    padding: 8px;
  }
  nav small {
    font-size: 10px;
  }
  h1 {
    font-size: 38px;
  }
  h2 {
    font-size: 32px;
  }
  legend {
    font-size: 19px;
  }
  aside {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }
  footer {
    padding: 20px 5vw;
  }
  .file-actions {
    margin-left: 0;
    gap: 8px;
  }
  footer button,
  .file-button {
    font-size: 12px;
    padding: 9px 12px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}

p,
legend,
.choice span {
  overflow-wrap: anywhere;
}
p {
  white-space: pre-line;
}

.confirmation {
  width: min(32rem, calc(100vw - 48px));
  box-sizing: border-box;
  padding: 24px;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.confirmation::backdrop { background: rgb(0 0 0 / 45%); }
.confirmation .actions { flex-wrap: wrap; }
.confirmation h2 { margin-top: 0; }
.criteria-preview { margin-block: 24px; }
.criteria-preview li { margin-block: 8px; }
</style></head>

<script type="application/json" id="topic-data">{"pack":{"schema_version":"1.0","id":"requirements-writing","version":"1.0.2","title":"Write requirements you can verify","subtitle":"Turn a vague request into an observable obligation. Practice applying it and checking its intended use.","audience":"Adults new to requirements writing. No systems engineering background required.","minutes":20,"review_days":[7,21],"sources":[{"id":"nasa-c","title":"NASA Systems Engineering Handbook — Appendix C","url":"https://www.nasa.gov/reference/appendix-c-how-to-write-a-good-requirement/","section":"C.1; C.2 Product Requirement; C.3; C.4 Clarity, Completeness, Correctness, Performance and Verifiability/Testability","accessed":"2026-10-03","coverage":"selected-sections","claim":"A requirement names its responsible product, states one obligation, and supports an objective compliance check. Ambiguous terms and unjustified assumptions weaken it.","limits":"Selected guidance, not a complete requirements standard or approval checklist. Local project rules and justified design constraints still apply. Web edition inspected by the authoring agent on 2026-10-03; no independent human source approval is claimed."},{"id":"nasa-v","title":"NASA Systems Engineering Handbook — Product Verification","url":"https://www.nasa.gov/reference/5-3-product-verification/","section":"5.3 introduction; 5.3.1.1 Inputs; 5.3.1.2.1 Product Verification Preparation, Methods of Verification","accessed":"2026-10-03","coverage":"selected-sections","claim":"Verification compares a realized product with its specified requirements using planned evidence. Inspection, analysis, demonstration, and test can contribute.","limits":"The appropriate evidence method depends on the requirement and product. A measurement example here is not a full test procedure. Web edition inspected by the authoring agent on 2026-10-03; no independent human source approval is claimed."},{"id":"nasa-validation","title":"NASA Systems Engineering Handbook — Product Validation","url":"https://www.nasa.gov/reference/5-4-product-validation/","section":"5.4 introduction; 5.4.1.1 Inputs; 5.4.1.2 Process Activities and Methods of Validation","accessed":"2026-10-03","coverage":"selected-sections","claim":"Product validation examines whether the product fulfills its intended use and stakeholder expectations in the relevant environment.","limits":"Passing a specified threshold alone does not establish fitness for the real use. Requirements validation and product validation are distinct activities. Web edition inspected by the authoring agent on 2026-10-03; no independent human source approval is claimed. Appendix C.4 addresses requirements validation; this page concerns the realized product."}],"content_notice":"Original, AI-assisted instructional synthesis and invented exercises informed by the linked NASA guidance; source text and media are not redistributed. Numerical thresholds and project facts are teaching assumptions, not NASA requirements. No NASA endorsement, certification or independent human content approval is implied. Source links identify the inspected guidance.","concepts":[{"id":"obligation","title":"One clear obligation","objective":"Identify the responsible product and separate independent obligations.","prerequisites":[],"source_ids":["nasa-c"],"explanation":"Name the product and its required behavior. Split obligations that can pass or fail independently. Put the reason for a requirement in a separate rationale.","misconception":"Adding “shall” does not make an ambiguous or compound sentence verifiable.","example":{"before":"The desk service should be helpful and notify users and keep records.","after":"DESK-01: The desk service shall send a receipt to the requester after accepting a support request.","why":"This isolates one behavior. Receipt content and delivery timing still need separate agreed criteria; this sentence is not yet a finished baseline."},"questions":{"diagnostic":{"prompt":"A draft says: “The station display shall show departures and archive maintenance logs.” What is the first useful repair?","choices":[{"id":"a","text":"Split departure display behavior from maintenance-log archiving.","feedback":"Yes. Each obligation can fail while the other succeeds. Separate them before defining detailed acceptance criteria."},{"id":"b","text":"Replace “shall” with “will.”","feedback":"Changing the verb does not resolve the two independent obligations."},{"id":"c","text":"Add “reliably” to the end.","feedback":"“Reliably” adds no measurable criterion and leaves both obligations tangled."}],"correct":"a","hint":"Could one part pass while the other fails?"},"practice":{"prompt":"Which draft isolates one product obligation?","choices":[{"id":"a","text":"The sensor shall log readings, email alerts, and stay easy to maintain.","feedback":"This combines logging, notification, and a vague maintenance goal."},{"id":"b","text":"The sensor shall record a timestamp with each accepted reading.","feedback":"Yes. One product performs one observable behavior. The timestamp format can be specified next."},{"id":"c","text":"The operator will probably review the readings.","feedback":"This describes an uncertain human activity, not a sensor obligation."}],"correct":"b","hint":"Find one named product and one observable behavior."},"transfer":{"prompt":"A library kiosk must print a receipt and erase a patron’s temporary session data. Why write two requirements?","choices":[{"id":"a","text":"To make the document look more detailed.","feedback":"Document length does not justify decomposition."},{"id":"b","text":"Because every sentence must have a numerical threshold.","feedback":"Not every requirement needs a number; some use observable states or content rules."},{"id":"c","text":"Because printing and erasure need independently checked outcomes.","feedback":"Yes. A printed receipt does not show that temporary data was erased."}],"correct":"c","hint":"Which outcomes would you need to observe before accepting the kiosk?"},"review":{"prompt":"A new draft says: “The pump shall report pressure and alert an operator when pressure is low.” What is the appropriate next step?","choices":[{"id":"a","text":"Check the acceptance evidence needed for reporting and alerting separately.","feedback":"Yes. Each independently failing outcome needs evidence. A single trial can provide both observations."},{"id":"b","text":"Accept one successful pressure reading as evidence that both behaviors work.","feedback":"A pressure reading does not demonstrate alert behavior. Check the evidence needed for each independently failing outcome."},{"id":"c","text":"Treat a shared responsible product as sufficient reason to accept both behaviors together.","feedback":"A shared responsible product does not establish that either behavior works. Each independently failing outcome needs evidence."}],"correct":"a","hint":"Look for independently failing behaviors."}},"writing":{"prompt":"A meeting-room service must confirm bookings and remove cancelled bookings from the room display. Write two separate product requirements. Leave unknown timing as an explicit open issue instead of inventing a promise.","criteria":[{"id":"subject","text":"Each statement names the responsible product."},{"id":"single","text":"Each statement contains one independently checkable obligation."},{"id":"unknown","text":"Unknown criteria are named as open issues, not hidden assumptions."}],"example":"ROOM-01: The booking service shall send a confirmation to the requester after accepting a booking. ROOM-02: After accepting a booking cancellation, the booking service shall remove that booking from the room display. Open issues: agree timing and confirmation content with the service owner.","notes":"This example treats the booking service as the system responsible for the displayed outcome, including cancellation propagation. A justified component allocation is also valid if it preserves the obligation from service acceptance of the cancellation through removal from the display. Starting only when the display receives a cancellation leaves undelivered cancellations uncovered. Compare the observable obligations and open issues, not exact wording. This self-check does not approve an engineering baseline."}},{"id":"measure","title":"Make the outcome observable","objective":"Specify an observable result, conditions, and a defensible acceptance boundary.","prerequisites":["obligation"],"source_ids":["nasa-c","nasa-v"],"explanation":"Replace vague performance words with an observable result and its conditions. Trace an approved threshold to the scenario or an agreed stakeholder basis. During drafting, a justified provisional estimate may be marked for resolution with its rationale, responsible owner and resolution date. Do not present it as an approved commitment; confirm assumptions before baselining.","misconception":"An exact number is not evidence that the number is justified.","example":{"before":"The desk service shall respond quickly.","after":"Teaching assumption: the service owner agrees a 5-second receipt target. DESK-02: When an online request is accepted, the desk service shall deliver its receipt within 5 seconds of acceptance.","why":"A tester can compare the acceptance and receipt timestamps. The assumed target needs validation before real use."},"questions":{"diagnostic":{"prompt":"The owner asks for a “fast” receipt but gives no timing target. What should you do?","choices":[{"id":"a","text":"Declare a 10-millisecond target because it is precise.","feedback":"Precision does not justify a target or prove feasibility."},{"id":"b","text":"Agree a justified timing target and conditions with the owner.","feedback":"Yes. Resolve the missing criterion and its basis instead of quietly inventing it."},{"id":"c","text":"Accept “fast” because everyone understands it.","feedback":"Different readers can interpret “fast” differently."}],"correct":"b","hint":"Where does the proposed acceptance threshold come from?"},"practice":{"prompt":"Teaching assumption: an owner agrees that offline events must be uploaded within 60 seconds after connectivity returns. Which draft is checkable?","choices":[{"id":"a","text":"The client shall upload offline events soon.","feedback":"“Soon” has no agreed test boundary."},{"id":"b","text":"The client shall upload offline events as appropriate.","feedback":"“As appropriate” leaves the triggering conditions unspecified."},{"id":"c","text":"After connectivity returns, the client shall upload its queued offline events within 60 seconds.","feedback":"Yes. This is the best checkable draft under the stated assumption: it retains the trigger, result and 60-second boundary. A complete test specification would also define conditions such as backlog and connectivity."}],"correct":"c","hint":"Use the supplied condition and threshold."},"transfer":{"prompt":"A luggage counter must update within 2 seconds after a scan. What evidence directly checks that timing?","choices":[{"id":"a","text":"Elapsed time from the scan to transmission of the update request, without observing the counter update.","feedback":"This stops at an intermediate event. It does not measure the full interval from the scan to the required counter update."},{"id":"b","text":"The difference between scan and counter-update timestamps under the specified conditions.","feedback":"Yes. Observe the defined trigger and result using an adequate time measurement method."},{"id":"c","text":"A user saying the counter looks modern.","feedback":"Appearance does not establish timing compliance."}],"correct":"b","hint":"Measure the interval named in the requirement."},"review":{"prompt":"An invented scenario specifies a temperature reading within ±0.5 °C at 20 °C. Which result violates that requirement?","choices":[{"id":"a","text":"20.2 °C","feedback":"This is 0.2 °C above the reference and inside the stated boundary."},{"id":"b","text":"19.6 °C","feedback": g a stated requirement proves that the product fulfills the actual user need. Instead, check intended use: a product can meet the requirement while failing that need.","example":{"before":"The receipt arrives within 5 seconds, so the service is useful.","after":"Verification: measure receipt timing. Product validation: observe whether requesters can use the receipt to track the right request in their real workflow.","why":"Fast delivery alone does not establish that the receipt helps the requester."},"questions":{"diagnostic":{"prompt":"A booking receipt passes its timing test, but users cannot identify the room it confirms. What follows?","choices":[{"id":"a","text":"The timing requirement may pass while the intended use remains unmet.","feedback":"Yes. The evidence answers the timing question, not every user-need question."},{"id":"b","text":"Passing timing proves the full service is useful.","feedback":"The timing result does not establish that users can identify their booking."},{"id":"c","text":"Verification should be abandoned.","feedback":"Compliance checks remain useful; they need complementary evidence about use."}],"correct":"a","hint":"What exactly did the timing test establish?"},"practice":{"prompt":"Which activity directly examines the intended use of helping users reach their booked room?","choices":[{"id":"a","text":"Checking that the confirmation arrives within its specified time limit, without observing whether users reach the room.","feedback":"This checks timing compliance but does not establish whether the confirmation helps users identify and reach their booked room."},{"id":"b","text":"Watching representative users identify and reach their booked room using the confirmation.","feedback":"Yes. This examines the intended outcome in a relevant workflow. The purpose and acceptance basis distinguish validation from verification; either can involve users."},{"id":"c","text":"Counting the number of requirement pages.","feedback":"Document size does n           "p",
          "Writing checks are your own assessment. Quiz results do not establish independent writing skill.",
        ),
      );
      if (r.writing_example_views) {
        aside.append(el("p", `Worked writing response opened ${r.writing_example_views} time(s). ${r.writing_after_example ? "At least one draft was saved after viewing an example." : "No later draft has been saved."} This is assisted practice context, not independent writing evidence.`));
      }
      aside.append(el("h3", "Source notes"));
      for (const id of c.source_ids) {
        const s = pack.sources.find((x) => x.id === id),
          block = el("div", undefined, "source");
        const a = el("a", s.title);
        a.href = s.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.addEventListener("click", () =>
          act({ type: "study", concept: c.id }),
        );
        block.append(
          a,
          el("p", s.section),
          el("p", `Inspected ${s.accessed} · selected material`),
        );
        aside.append(block);
      }
      aside.append(
        button(
          "Read explanation & limits",
          () => {
            if (!act({ type: "study", concept: c.id })) return;
            const block = el("div", undefined, "source");
            block.append(
              el("h3", "Explanation"),
              el("p", c.explanation),
              el("p", c.misconception),
            );
            for (const id of c.source_ids) {
              const s = pack.sources.find((x) => x.id === id);
              block.append(el("p", s.claim), el("p", s.limits));
            }
            aside.replaceChildren(block);
            aside.append(
              button("Back to progress", () => evidence(c), "quiet"),
            );
          },
          "quiet",
        ),
      );
      const report = el("div", undefined, "report");
      report.append(
        el("h3", "Something unclear?"),
        el(
          "p",
          "Export a topic issue for the author. It contains topic identity and category, never your answers.",
        ),
      );
      for (const [category, label] of [
        ["confusing", "Confusing wording"],
        ["answer-key", "Question or answer issue"],
        ["source", "Source needs review"],
      ]) {
        report.append(
          button(
            label,
            () => {
              download(
                `${pack.id}-issue.json`,
                JSON.stringify(
                  {
                    schema_version: "1.0",
                    type: "improvement-candidate",
                    topic: pack.id,
                    version: pack.version,
                    digest,
                    concept: c.id,
                    question_stage: displayedStage,
                    category,
                    created_at: now(),
                    status: "unreviewed",
                  },
                  null,
                  2,
                ),
              );
              tell(
                "Issue file prepared for download. Nothing was sent and no lesson content changed.",
              );
            },
            "quiet",
          ),
        );
      }
      aside.append(report);
    } else {
      aside.append(
        el(
          "p",
          "No account. No tracking. Works offline. Source links open only when you choose them.",
        ),
      );
      aside.append(
        el("h3", "Keep your work"),
        el(
          "p",
          "Progress starts in this tab only. Enable device saving or export a file before closing. Avoid confidential project or personal information.",
        ),
      );
      aside.append(
        el("h3", "Review policy"),
        el(
          "p",
          `First review: ${pack.review_days[0]} days after self-review. Later reviews: ${pack.review_days.at(-1)} days after a correct answer; one day after a wrong answer. These intervals are a starting policy, not a personalized prediction.`,
        ),
      );
    }
  }
  function overview() {
    main.append(
      el("p", "LEARN · PRACTISE · RETURN", "eyebrow"),
      el("h1", pack.title),
      el("p", pack.subtitle, "intro"),
      el(
        "p",
        `About ${pack.minutes} minutes to start (estimate) · ${pack.concepts.length} concepts · source-grounded examples`,
        "meta",
      ),
    );
    const list = el("ol", undefined, "path");
    for (const c of pack.concepts) list.append(el("li", c.objective));
    main.append(list);
    main.append(
      button(
        session.events.length ? "Continue practice" : "Start practice",
        () => go(firstAvailable()),
        "primary",
      ),
    );
    main.append(
      el("div", undefined, "rule"),
      el("h3", "How this works"),
      el(
        "p",
        "Try a short scenario first. A wrong answer opens a worked example and practice. A correct answer moves to a new application. Then write your own response, self-review it, and return for retrieval.",
      ),
    );
    const rows = core.summary(pack, session, now());
    for (const row of rows.filter((r) => r.due)) {
      const c = pack.concepts.find((x) => x.id === row.id);
      const d = el("div", undefined, "progress-row");
      d.append(
        el("span", c.title),
        el(
          "span",
          row.stage === "review"
            ? "Review due now"
            : `Review ${new Date(row.due).toLocaleDateString()}`,
        ),
      );
      main.append(d);
    }
    main.append(el("p", pack.content_notice, "notice-box"));
  }
  function worked(c) {
    main.append(el("p", c.explanation, "intro"));
    for (const [label, text] of [
      ["Draft", c.example.before],
      ["Worked example", c.example.after],
      ["Why it helps", c.example.why],
    ]) {
      const block = el("div", undefined, "example");
      block.append(el("span", label, "label"), el("p", text));
      main.append(block);
    }
    main.append(
      el("p", c.misconception),
      button(
        "Try a practice question",
        () => {
          if (act({ type: "study", concept: c.id })) render();
        },
        "primary",
      ),
    );
  }
  function question(c, stage) {
    const q = c.questions[stage],
      form = el("form"),
      field = el("fieldset");
    field.append(el("legend", q.prompt));
    for (const option of q.choices) {
      const label = el("label", undefined, "choice"),
        input = el("input");
      input.type = "radio";
      input.name = "answer";
      input.value = option.id;
      input.required = true;
      label.append(input, el("span", option.text));
      field.append(label);
    }
    const check = el("button", "Check answer", "primary");
    check.type = "submit";
    const hintArea = el("p", undefined, "hint");
    hintArea.setAttribute("aria-live", "polite");
    const hint = button(
      "Give me a hint",
      () => {
        if (act({ type: "hint", concept: c.id })) {
          hintArea.textContent = q.hint;
          hintArea.tabIndex = -1;
          hintArea.focus();
          hint.disabled = true;
        }
      },
      "quiet",
    );
    const actions = el("div", undefined, "actions");
    actions.append(check, hint);
    form.append(field, actions, hintArea);
    form.addEventListener("submit", (ev) => {
      ev.preventDefault();
      const chosen = new FormData(form).get("answer");
      if (!chosen) return;
      if (!act({ type: "answer", concept: c.id, choice: chosen })) return;
      field.disabled = true;
      check.disabled = true;
      hint.disabled = true;
      const receipt = session.events.at(-1),
        correct = chosen === q.correct;
      const feedback = el(
        "section",
        undefined,
        `feedback${correct ? "" : " wrong"}`,
      );
      feedback.tabIndex = -1;
      feedback.append(
        el(
          "h3",
          correct
            ? "That follows from the scenario."
            : "Look at the evidence again.",
        ),
        el("p", q.choices.find((x) => x.id === chosen).feedback),
      );
      if (!correct)
        feedback.append(
          el(
            "p",
            `Supported answer: ${q.choices.find((x) => x.id === q.correct).text}`,
          ),
        );
      feedback.append(
        el(
          "p",
          receipt.helped
            ? "Support or a prior attempt was used. This is practice evidence."
            : "First answer without recorded support for this question.",
          "meta",
        ),
      );
      const next = button(
        stage === "review" ? "See your review status" : "Continue",
        () => {
          render();
          main.focus();
        },
        "primary",
      );
      feedback.append(next);
      form.append(feedback);
      feedback.focus();
      evidence(c);
      navigation();
    });
    main.append(form);
  }
  function writing(c, edit = false) {
    main.append(el("p", c.writing.prompt, "intro"));
    const criteriaPreview = el("section", undefined, "criteria-preview");
    criteriaPreview.append(el("h3", "What to include"));
    const criteriaList = el("ul");
    for (const criterion of c.writing.criteria) criteriaList.append(el("li", criterion.text));
    criteriaPreview.append(criteriaList, el("p", c.writing.notes, "meta"));
    main.append(criteriaPreview);
    const label = el("label", "Your response");
    label.htmlFor = "draft";
    const draft = el("textarea");
    draft.id = "draft";
    draft.maxLength = 4000;
    draft.setAttribute("aria-describedby", "draft-helper draft-char-count");
    draft.value = last("write", c.id)?.text || "";
    const charCount = el("p", `${draft.value.length} / 4000`, "meta char-count");
    charCount.id = "draft-char-count";
    draft.addEventListener("input", () => {
      dirtyDraft = true;
      recovery.disabled = false;
      charCount.textContent = `${draft.value.length} / 4000`;
    });
    const helperText = el(
      "p",
      "10–4,000 characters. Use invented examples; omit confidential information.",
      "meta",
    );
    helperText.id = "draft-helper";
    main.append(
      label,
      draft,
      helperText,
      charCount,
    );
    const recovery = button("Download unsaved draft", () => {
      if (!dirtyDraft) return;
      download(`${pack.id}-${c.id}-unsaved-draft.json`, JSON.stringify({
        type: "draft-recovery",
        notice: "Unsaved text recovery only. This is not a replayable progress file and cannot be imported as lesson progress.",
        topic: pack.id,
        version: pack.version,
        digest,
        concept: c.id,
        text: draft.value,
        created_at: now(),
      }, null, 2));
      tell("Unsaved draft recovery file prepared for download. It is not replayable progress. Your draft remains unsaved in this tab; export recorded progress separately if needed.");
    }, "quiet");
    recovery.disabled = !dirtyDraft;
    main.append(recovery);
    const reviewArea = el("section");
    const save = button(
      "Save draft & self-review",
      () => {
        if (!act({ type: "write", concept: c.id, text: draft.value })) return;
        dirtyDraft = false;
        recovery.disabled = true;
        renderChecks();
        tell(
          saved
            ? "Draft saved in this browser."
            : "Draft retained in this tab. Export or enable device saving to keep it.",
        );
      },
      "primary",
    );
    main.append(save, reviewArea);
    function renderChecks() {
      reviewArea.replaceChildren();
      const reviewHeading = el("h3", "Check your work");
      reviewHeading.id = "review-heading";
      const reviewDesc = el(
        "p",
        "Select only criteria your draft meets. Leave uncertain items unchecked. This is self-review, not automated grading.",
      );
      reviewDesc.id = "review-description";
      reviewArea.append(reviewHeading, reviewDesc);

      const group = el("div");
      group.setAttribute("role", "group");
      group.setAttribute("aria-labelledby", "review-heading");
      group.setAttribute("aria-describedby", "review-description");

      const inputs = [];
      for (const criterion of c.writing.criteria) {
        const l = el("label", undefined, "check"),
          i = el("input");
        i.type = "checkbox";
        i.value = criterion.id;
        inputs.push(i);
        l.append(i, el("span", criterion.text));
        group.append(l);
      }
      reviewArea.append(group);
      const example = el("div");
      reviewArea.append(
        button(
          "Compare a worked response",
          () => {
            if (!act({ type: "writing-example", concept: c.id })) return;
            evidence(c);
            example.replaceChildren(
              el("p", c.writing.example),
              el("p", c.writing.notes, "meta"),
            );
          },
          "quiet",
        ),
        example,
      );
      reviewArea.append(
        button(
          "Record self-review",
          () => {
            if (dirtyDraft) {
              tell(
                "Save your changed draft before recording its self-review.",
                true,
              );
              return;
            }
            if (
              act({
                type: "self-review",
                concept: c.id,
                criteria: inputs.filter((i) => i.checked).map((i) => i.value),
              })
            ) {
              render();
              main.focus();
            }
          },
          "primary",
        ),
      );
    }
    if (last("write", c.id) && !edit) renderChecks();
  }
  function completion(c, s) {
    main.append(
      el("p", "Practice recorded", "tag"),
      el("h2", "Leave room for recall."),
      el(
        "p",
        `Your next question is due ${new Date(s.due).toLocaleString()}. Return without looking at the explanation first.`,
        "intro",
      ),
    );
    main.append(
      el(
        "p",
        `${s.self_checks} of ${s.criteria_count} writing criteria checked by you. ${s.self_checks < s.criteria_count ? "Unmet or uncertain criteria remain worth revising." : "A tutor can review your draft for evidence beyond this self-check."}`,
      ),
    );
    main.append(
      el(
        "p",
        "Completing this practice does not certify mastery. Review answers test a limited skill; later repetitions are not unseen assessments.",
        "meta",
      ),
    );
    const actions = el("div", undefined, "actions");
    const next = pack.concepts.find(
      (x) =>
        !["complete", "locked"].includes(
          core.status(pack, session, x.id, now()).stage,
        ),
    );
    actions.append(
      button(
        next ? "Continue to the next task" : "Back to your learning path",
        () => go(next?.id || null),
        "primary",
      ),
    );
    actions.append(
      button(
        "Revise my draft",
        () => {
          main.replaceChildren(
            el("p", c.title, "eyebrow"),
            el("h2", "Revise your response"),
          );
          writing(c, true);
        },
        "quiet",
      ),
    );
    main.append(actions);
    main.append(
      el("div", undefined, "rule"),
      el("h3", "Your saved draft"),
      el("p", last("write", c.id).text),
    );
  }
  function render() {
    main.replaceChildren();
    navigation();
    const c = pack.concepts.find((x) => x.id === selected);
    evidence(c);
    if (!c) {
      document.title = `${pack.title} · Learning Lab`;
      overview();
      return;
    }
    document.title = `${c.title} · ${pack.title} · Learning Lab`;
    const s = core.status(pack, session, c.id, now());
    displayedStage = s.stage;
    main.append(
      el(
        "p",
        `${String(pack.concepts.indexOf(c) + 1).padStart(2, "0")} / ${String(pack.concepts.length).padStart(2, "0")} · ${s.stage.toUpperCase()}`,
        "eyebrow",
      ),
    );
    if (s.stage !== "complete") main.append(el("h2", c.title));
    if (["diagnostic", "practice", "transfer", "review"].includes(s.stage))
      question(c, s.stage);
    else if (s.stage === "lesson") worked(c);
    else if (s.stage === "writing") writing(c);
    else if (s.stage === "complete") completion(c, s);
    else main.append(el("p", "Complete the prerequisite practice first."));
  }
  document.querySelector(".wordmark").addEventListener("click", (e) => {
    e.preventDefault();
    go(null);
  });
  document.getElementById("export").addEventListener("click", () => {
    download(`${pack.id}-progress.json`, JSON.stringify(session));
    if (dirtyDraft) {
      tell(
        "Recorded progress file prepared for download. Your unsaved draft is not included and remains in this tab. Use Download unsaved draft separately before closing. Neither download saves that text into lesson progress.",
        true,
      );
      return;
    }
    tell(
      "Progress file prepared for download. It includes written exercises. Keep it private or remove text before sharing.",
    );
  });
  document.getElementById("import").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      if (file.size > core.MAX_IMPORT)
        throw new Error("Progress file exceeds 1 MB.");
      const candidate = core.importSession(
        pack,
        digest,
        await file.text(),
        now(),
      );
      if (
        !(await confirmAction(
          "Replace tab progress?",
          "Replace current tab progress, including unsaved text, with this imported record? Device saving will be turned off. Any existing browser copy stays unchanged.",
          "Replace tab progress",
        ))
      )
        return;
      // Do not mutate a previously saved browser copy during import.
      session = candidate;
      saved = false;
      dirtyDraft = false;
      selected = null;
      storageUI();
      render();
      tell(
        "Imported into this tab. Device saving is off; any prior browser copy remains until you save or clear it.",
      );
    } catch (error) {
      tell(
        `Import rejected. ${error.message} Current progress is unchanged.`,
        true,
      );
    } finally {
      e.target.value = "";
    }
  });
  document.getElementById("clear").addEventListener("click", async () => {
    if (
      !(await confirmAction(
        "Clear this topic?",
        "Clear this topic’s progress from this tab and browser? Downloaded files, other topic versions, and backups will remain.",
        "Clear topic progress",
      ))
    )
      return;
    const removal = removeBrowserCopy();
    session = core.createSession(pack, digest, now());
    saved = false;
    selected = null;
    dirtyDraft = false;
    storageUI();
    render();
    if (removal === "removed") {
      storageWarning = null;
      tell("This topic’s tab and browser progress cleared. Other copies remain unchanged.");
    } else {
      storageProblem(removal === "changed"
        ? "Tab progress cleared. A changed or unverified browser copy was retained; reload to review it. Downloaded files and backups remain."
        : "Tab progress cleared. The browser copy could not be removed; use browser site-data controls. Downloaded files and backups remain.");
    }
  });
  window.addEventListener("storage", (event) => {
    if (event.key !== null && event.key !== key) return;
    try {
      if (event.storageArea && event.storageArea !== localStorage) return;
      // Read current bytes rather than a possibly queued, older event value.
      if (localStorage.getItem(key) === storageSnapshot) return;
    } catch (_) {
      // An unreadable browser copy is also unsafe to overwrite.
    }
    storageProblem("Browser progress changed in another tab or window. Saving is off; this tab's work remains here. Export it, then reload to review the browser copy. Changes are not merged automatically.");
  });
  window.addEventListener("beforeunload", (e) => {
    if (dirtyDraft || (!saved && session.events.length)) {
      e.preventDefault();
      e.returnValue = "";
    }
  });
  try {
    const stored = localStorage.getItem(key);
    storageSnapshot = stored;
    if (stored) {
      session = core.importSession(pack, digest, stored, now());
      saved = true;
    }
  } catch (error) {
    storageProblem(
      `Saved progress could not be loaded: ${error.message} Start in this tab or import a valid export.`,
    );
  }
  storageUI();
  render();
})();
</script></body></html>
