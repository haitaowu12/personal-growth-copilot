name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11.15", "3.12.13", "3.13.15", "3.14.7"]
        include:
          - os: macos-14
            python-version: "3.13.15"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Use OpenSSL 3 for signed-evidence tests
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Check signing runtime
        run: openssl version
      - run: python3 -m pip install --require-hashes -r requirements/ci.txt
      - run: python3 scripts/run_deterministic_qualification.py
      - name: Bind qualification to hosted checkout
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13.15'
        run: |
          python3 scripts/verify_exact_head_ci.py \
            --qualification build/evidence/deterministic-qualification.json \
            --expected-sha "$GITHUB_SHA" \
            --output build/evidence/exact-head-ci.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deterministic-qualification-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: |
            build/evidence/deterministic-qualification.json
            build/evidence/multiturn-harness-conformance.json
          if-no-files-found: error
      - if: always() && matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.13.15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-head-qualification
          path: build/evidence/exact-head-ci.json
          if-no-files-found: error

  learning-browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.15"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: python3 -m pip install --require-hashes -r requirements/ci.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser engine
        run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - name: Build packaged learning candidate
        run: |
          python3 scripts/package_learning.py --out build/learning-candidate.zip
          python3 -c "import zipfile; zipfile.ZipFile('build/learning-candidate.zip').extractall('build/learning-package')"
      - name: Run packaged-file browser acceptance
        run: |
          npm run test:learning-browser -- \
            --browser ${{ matrix.browser }} \
            --html build/learning-package/requirements-writing.html \
            --evidence build/evidence/learning-browser-${{ matrix.browser }}.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: learning-browser-acceptance-${{ matrix.browser }}
          path: |
            build/evidence/learning-browser-${{ matrix.browser }}.json
            build/learning-candidate.zip
          if-no-files-found: error
