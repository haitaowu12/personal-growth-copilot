name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11.15", "3.12.13", "3.13.15", "3.14.7"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m pip install --require-hashes -r requirements/ci.txt
      - run: python3 scripts/run_deterministic_qualification.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deterministic-qualification-python-${{ matrix.python-version }}
          path: build/evidence/deterministic-qualification.json
          if-no-files-found: error
